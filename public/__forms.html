<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Forms</title></head>
<body>
  <!-- Registers the contact form with Netlify Forms at deploy time. The real UI lives at /contact/. -->
  <form name="brief" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="brief" />
    <input name="bot-field" />
    <input name="name" />
    <input name="email" type="email" />
    <input name="company" />
    <input name="services" />
    <input name="commitment" />
    <input name="timezone" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
